<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S02 · Problem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:540px;overflow:hidden;background:#f8fafc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b}
.scene{width:100%;height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(59,130,246,.04) 0%,transparent 60%)}
.q{font-size:30px;font-weight:800;color:#0f172a;z-index:1;margin-bottom:36px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(4,180px);gap:12px;z-index:1}
.card{height:64px;background:white;border:1px solid #e2e8f0;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:#475569;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.card .d{font-size:20px}
.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(.8deg)}
.card:nth-child(1){border-left:3px solid #ef4444}.card:nth-child(2){border-left:3px solid #f59e0b}
.card:nth-child(3){border-left:3px solid #3b82f6}.card:nth-child(4){border-left:3px solid #10b981}
.card:nth-child(5){border-left:3px solid #6366f1}.card:nth-child(6){border-left:3px solid #ec4899}
.card:nth-child(7){border-left:3px solid #06b6d4}.card:nth-child(8){border-left:3px solid #f97316}
.ask{font-size:20px;color:#3b82f6;z-index:1;margin-top:32px;font-weight:700}
.ask span{color:#0f172a}
</style></head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="q">一周的工作，散落在多少地方？</div>
  <div class="grid">
    <div class="card"><span class="d">📋</span> 会议纪要</div>
    <div class="card"><span class="d">📄</span> 需求文档</div>
    <div class="card"><span class="d">💻</span> 代码仓库</div>
    <div class="card"><span class="d">📊</span> Dashboard</div>
    <div class="card"><span class="d">💬</span> 微信指令</div>
    <div class="card"><span class="d">🔗</span> n8n 流程</div>
    <div class="card"><span class="d">📝</span> 飞书文档</div>
    <div class="card"><span class="d">🤖</span> Agent 日志</div>
  </div>
  <div class="ask">如果有一个系统<span>能把这些串起来</span>呢？</div>
</div>
</body>
</html>
