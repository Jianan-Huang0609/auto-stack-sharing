<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S05 · Multi-Agent OS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:540px;overflow:hidden;background:#f8fafc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b}
.scene{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(59,130,246,.04) 0%,transparent 60%)}
.ring{position:absolute;border-radius:50%;border:1px solid}
.r0{width:440px;height:440px;border-color:#e2e8f0}
.r1{width:340px;height:340px;border-color:#dbeafe;border-style:dashed}
.r2{width:240px;height:240px;border-color:#bfdbfe}
.core{width:120px;height:120px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;box-shadow:0 8px 40px rgba(59,130,246,.1);border:2px solid #bfdbfe}
.core .e{font-size:40px}.core .l{font-size:13px;font-weight:800;color:#2563eb;letter-spacing:.05em}
.node{position:absolute;text-align:center;z-index:5}
.node .e{font-size:34px;margin-bottom:4px}
.node .n{font-size:17px;font-weight:800;color:#1e293b}
.node .r{font-size:11px;color:#94a3b8}
.n1{top:28px;left:50%;transform:translateX(-50%)}
.n2{right:44px;top:50%;transform:translateY(-50%)}
.n3{bottom:50px;right:170px}
.n4{bottom:50px;left:170px}
.n5{left:44px;top:50%;transform:translateY(-50%)}
.leg{position:absolute;bottom:34px;display:flex;gap:28px;z-index:5}
.leg span{font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:8px}
.leg span::before{content:'';width:8px;height:8px;border-radius:50%}
</style></head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="ring r0"></div><div class="ring r1"></div><div class="ring r2"></div>
  <div class="core"><div class="e">🧠</div><div class="l">SAM</div></div>
  <div class="node n1"><div class="e">🌸</div><div class="n">Andrew</div><div class="r">学习 · 侦察</div></div>
  <div class="node n2"><div class="e">💼</div><div class="n">Rex</div><div class="r">工作 · CER</div></div>
  <div class="node n3"><div class="e">✍️</div><div class="n">Lulu</div><div class="r">内容 · 设计</div></div>
  <div class="node n4"><div class="e">💗</div><div class="n">Alex</div><div class="r">个人 · 生活</div></div>
  <div class="node n5"><div class="e">📡</div><div class="n">MAE</div><div class="r">编排 · 调度</div></div>
  <div class="leg">
    <span style="--c:#1e293b">Memory</span>
    <span style="--c:#3b82f6">Task Ledger</span>
    <span style="--c:#06b6d4">Heartbeat</span>
  </div>
</div>
</body>
</html>
