<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S07 · Hermes Evolution</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:540px;overflow:hidden;background:#f8fafc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b}
.scene{width:100%;height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,182,212,.04) 0%,transparent 70%);background-image:linear-gradient(rgba(0,0,0,.015) 1px,transparent 1px),radial-gradient(ellipse at 50% 50%,rgba(6,182,212,.04) 0%,transparent 70%);background-size:48px 48px,100% 100%}
h2{font-size:42px;font-weight:900;color:#0f172a;z-index:1;letter-spacing:-.02em;margin-bottom:36px}
h2 em{font-style:normal;color:#3b82f6}
.loop{display:flex;align-items:center;gap:8px;z-index:1}
.step{width:130px;height:96px;background:white;border:1px solid #f1f5f9;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.step .i{font-size:28px}.step .l{font-size:14px;font-weight:700;color:#334155;text-align:center;line-height:1.3}
.arr{font-size:18px;color:#cbd5e1}
.s1{border-left:3px solid #3b82f6}.s2{border-left:3px solid #06b6d4}
.s3{border-left:3px solid #10b981}.s4{border-left:3px solid #f59e0b}
.s5{border-left:3px solid #6366f1}
.sub{z-index:1;margin-top:28px;font-size:16px;color:#64748b;text-align:center;line-height:1.6}
.sub strong{color:#2563eb}
</style></head>
<body>
<div class="scene">
  <div class="bg"></div>
  <h2>系统自己 <em>进化</em></h2>
  <div class="loop">
    <div class="step s1"><div class="i">👁️</div><div class="l">Observe</div></div>
    <div class="arr">→</div>
    <div class="step s2"><div class="i">🔍</div><div class="l">Detect<br>Pattern</div></div>
    <div class="arr">→</div>
    <div class="step s3"><div class="i">📝</div><div class="l">Dry-run<br>Patch</div></div>
    <div class="arr">→</div>
    <div class="step s4"><div class="i">✅</div><div class="l">Human<br>Confirm</div></div>
    <div class="arr">→</div>
    <div class="step s5"><div class="i">🔄</div><div class="l">Skill<br>Update</div></div>
  </div>
  <div class="sub"><strong>Hermes Evolution Loop</strong><br>每周自动审视：哪里在重复？哪里可以变成 skill？</div>
</div>
</body>
</html>
