<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI OS — Full Storyboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:20px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.viewport{width:960px;height:540px;border-radius:12px;overflow:hidden;box-shadow:0 0 80px rgba(124,58,237,.15),0 20px 60px rgba(0,0,0,.6);background:#060610}
iframe{width:100%;height:100%;border:none}
.controls{display:flex;gap:12px;align-items:center}
.btn{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#94a3b8}
.btn:hover{background:rgba(255,255,255,.1);color:#e2e8f0;border-color:rgba(255,255,255,.2)}
.btn.primary{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.3);color:#c4b5fd}
.btn.primary:hover{background:rgba(139,92,246,.3)}
.dots{display:flex;gap:8px}
.dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.35);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .2s}
.dot:hover{border-color:rgba(255,255,255,.3);color:#94a3b8}
.dot.active{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.5);color:#c4b5fd}
.info{color:rgba(255,255,255,.25);font-size:13px}
</style></head>
<body>
<div class="viewport"><iframe id="frame" src="v2/scene-01-hook.html"></iframe></div>
<div class="dots" id="dots"></div>
<div class="controls">
  <button class="btn" id="prev">◀</button>
  <button class="btn primary" id="auto">▶ Auto Play</button>
  <button class="btn" id="next">▶</button>
</div>
<div class="info">← → 键盘翻页 · 空格自动播放 · 每帧 3s</div>
<script>
const S=[
  {f:'v2/scene-01-hook.html',n:'Hook'},
  {f:'v2/scene-02-problem.html',n:'Problem'},
  {f:'v2/scene-03-plo.html',n:'PLO'},
  {f:'v2/scene-04-architecture.html',n:'Arch×Matt'},
  {f:'v2/scene-05-agents.html',n:'Agents'},
  {f:'v2/scene-06-n8n.html',n:'n8n'},
  {f:'v2/scene-07-hermes.html',n:'Hermes'},
  {f:'v2/scene-08-meta.html',n:'Meta'}
];
let i=0,t=null;
const F=document.getElementById('frame'),D=document.getElementById('dots');
S.forEach((s,j)=>{
  const d=document.createElement('div');d.className='dot'+(j===0?' active':'');
  d.textContent=j+1;d.title=s.n;d.onclick=()=>{stop();go(j)};
  D.appendChild(d);
});
function go(j){i=j;F.src=S[j].f;document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('active',k===j))}
function next(){go((i+1)%S.length)}function prev(){go((i-1+S.length)%S.length)}
function stop(){if(t){clearInterval(t);t=null;document.getElementById('auto').textContent='▶ Auto Play'}}
document.getElementById('auto').onclick=function(){
  if(t){stop();return}
  this.textContent='⏸ Stop';next();t=setInterval(next,3000);
};
document.getElementById('next').onclick=()=>{stop();next()};
document.getElementById('prev').onclick=()=>{stop();prev()};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stop();next()}
  if(e.key==='ArrowLeft'){stop();prev()}
  if(e.key===' '){e.preventDefault();document.getElementById('auto').click()}
});
</script>
</body>
</html>
