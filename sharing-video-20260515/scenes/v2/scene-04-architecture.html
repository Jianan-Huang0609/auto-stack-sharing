<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S04 · Arch × Matt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:540px;overflow:hidden;background:#f8fafc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b}
.scene{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;gap:80px}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 50%,rgba(6,182,212,.05) 0%,transparent 45%),radial-gradient(ellipse at 75% 50%,rgba(59,130,246,.05) 0%,transparent 45%)}
.vdiv{position:absolute;left:50%;top:70px;bottom:70px;width:1px;background:linear-gradient(180deg,transparent,#e2e8f0 30%,#e2e8f0 70%,transparent)}
.hdiv{position:absolute;top:42px;left:120px;right:120px;height:1px;background:linear-gradient(90deg,transparent,#e2e8f0 30%,#e2e8f0 70%,transparent)}
.col{z-index:1;text-align:center;width:260px}
.col .emoji{font-size:36px;margin-bottom:14px}
.col .title{font-size:30px;font-weight:900;color:#0f172a;margin-bottom:18px;letter-spacing:-.01em}
.col .item{font-size:16px;color:#475569;line-height:2.0}
.col .item b{color:#1e293b;font-weight:700}
.op{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font-size:28px;font-weight:200;color:#cbd5e1}
.foot{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:1;font-size:17px;color:#3b82f6;font-weight:700}
</style></head>
<body>
<div class="scene">
  <div class="bg"></div><div class="vdiv"></div><div class="hdiv"></div>
  <div class="col">
    <div class="emoji">🧠</div>
    <div class="title">Architecture Lens</div>
    <div class="item"><b>独特能力</b> 是什么</div>
    <div class="item"><b>能力包</b> 怎么拆</div>
    <div class="item"><b>谁负责</b> 什么</div>
    <div class="item"><b>Tradeoff</b> 怎么选</div>
  </div>
  <div class="op">×</div>
  <div class="col">
    <div class="emoji">🔨</div>
    <div class="title">Matt Execution</div>
    <div class="item"><b>grill → prd</b> 问清需求</div>
    <div class="item"><b>to-issues</b> 拆任务</div>
    <div class="item"><b>tdd → diagnose</b> 测试修复</div>
    <div class="item"><b>review → ship</b> 审查发布</div>
  </div>
  <div class="foot">双路径融合，不是二选一</div>
</div>
</body>
</html>
