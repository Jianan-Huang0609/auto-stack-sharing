<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scene 01 — From Chatbot to AI OS</title>
<style>
:root{--bg:#f8fafc;--ink:#1e293b;--muted:#64748b;--accent:#8b5cf6;--blue:#3b82f6;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
.scene{width:960px;height:540px;position:relative;display:flex;align-items:center;justify-content:center}
.hero{text-align:center}
.line1{font-size:72px;font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.line1 em{font-style:normal;color:var(--accent);background:linear-gradient(135deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.line2{font-size:24px;color:var(--muted);margin-top:24px;font-weight:500;letter-spacing:-.01em}
.arrow{font-size:48px;margin:16px 0;color:#cbd5e1}
.old{font-size:20px;color:#94a3b8;display:inline-block;padding:6px 24px;border:1px solid #e2e8f0;border-radius:999px;margin-right:12px;font-weight:500}
.new{font-size:20px;color:var(--accent);display:inline-block;padding:6px 24px;border:1px solid #c4b5fd;border-radius:999px;background:#f5f3ff;font-weight:700}
.pills{margin-top:28px}
.dot{display:inline-block;width:6px;height:6px;background:#cbd5e1;border-radius:50%;margin:0 12px;vertical-align:middle}
</style>
</head>
<body>
<div class="scene">
  <div class="hero">
    <div class="pills">
      <span class="old">Chatbot</span>
      <span class="dot"></span>
      <span class="new">AI Operating System</span>
    </div>
    <div class="line1" style="margin-top:32px">一人公司</div>
    <div class="line1">的<em>AI 工程化</em>尝试</div>
    <div class="line2">从聊天到操作系统：skills 路由 · agents 协调 · workflows 运转</div>
  </div>
</div>
</body>
</html>
