<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scene 06 — n8n Automation</title>
<style>
:root{--bg:#f8fafc;--ink:#1e293b;--muted:#64748b;--accent:#8b5cf6;--blue:#3b82f6;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
.scene{width:960px;height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.title{font-size:48px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px}
.title em{font-style:normal;background:linear-gradient(135deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:20px;color:var(--muted);margin-bottom:40px}
.flow{display:flex;align-items:center;gap:12px}
.block{width:140px;height:80px;background:white;border:1px solid #e2e8f0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.block .icon{font-size:28px;margin-bottom:4px}
.block .label{font-size:14px;font-weight:700;color:var(--ink)}
.b1{border-top:4px solid #f59e0b}
.b2{border-top:4px solid var(--blue)}
.b3{border-top:4px solid var(--accent)}
.b4{border-top:4px solid var(--green)}
.arrow{font-size:24px;color:#cbd5e1}
.caption{position:absolute;bottom:60px;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="scene">
  <div class="title">Workflows <em>自动运转</em></div>
  <div class="sub">n8n · Airtable · Dashboard · 提醒，一套打通</div>
  <div class="flow">
    <div class="block b1"><div class="icon">⚙️</div><div class="label">n8n 触发</div></div>
    <div class="arrow">→</div>
    <div class="block b2"><div class="icon">📊</div><div class="label">Airtable</div></div>
    <div class="arrow">→</div>
    <div class="block b3"><div class="icon">📈</div><div class="label">Dashboard</div></div>
    <div class="arrow">→</div>
    <div class="block b4"><div class="icon">🔔</div><div class="label">提醒 / 行动</div></div>
  </div>
  <div class="caption">每日心跳 → 自动同步 → 可视化 → 闭环</div>
</div>
</body>
</html>
