<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S03 · PLO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:960px;height:540px;overflow:hidden;background:#f8fafc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1e293b}
.scene{width:100%;height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(59,130,246,.05) 0%,transparent 65%);background-image:linear-gradient(rgba(0,0,0,.015) 1px,transparent 1px),radial-gradient(ellipse at 50% 0%,rgba(59,130,246,.05) 0%,transparent 65%);background-size:48px 48px,100% 100%}
.overline{font-size:12px;letter-spacing:.14em;color:#3b82f6;font-weight:700;margin-bottom:10px;z-index:1}
h2{font-size:48px;font-weight:900;color:#0f172a;z-index:1;letter-spacing:-.02em;margin-bottom:36px}
h2 em{font-style:normal;color:#3b82f6}
.cards{display:flex;gap:18px;z-index:1}
.c{width:190px;padding:26px 18px;background:white;border:1px solid #f1f5f9;border-radius:14px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.03)}
.c .i{font-size:32px;margin-bottom:12px}
.c .n{font-size:17px;font-weight:800;color:#0f172a;margin-bottom:6px}
.c .d{font-size:12px;color:#64748b;line-height:1.6}
.c{position:relative}.c::after{content:'';position:absolute;top:-1px;left:20px;right:20px;height:3px;border-radius:0 0 3px 3px}
.c:nth-child(1)::after{background:#3b82f6}.c:nth-child(2)::after{background:#06b6d4}
.c:nth-child(3)::after{background:#10b981}.c:nth-child(4)::after{background:#f59e0b}
.cap{z-index:1;margin-top:24px;font-size:15px;color:#64748b}
.cap strong{color:#2563eb}
</style></head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="overline">Product Lifecycle Orchestrator</div>
  <h2>一切项目，<em>先判断类型</em></h2>
  <div class="cards">
    <div class="c"><div class="i">🏭</div><div class="n">B2B Enterprise</div><div class="d">内部自动化<br>CER · PTR · QA</div></div>
    <div class="c"><div class="i">📢</div><div class="n">B2B Content</div><div class="d">影响力内容<br>分享 · 白皮书 · 视频</div></div>
    <div class="c"><div class="i">🎯</div><div class="n">ToC Product</div><div class="d">消费者产品<br>激活 · 留存 · 增长</div></div>
    <div class="c"><div class="i">🔧</div><div class="n">Personal</div><div class="d">个人工具<br>原型 · 迭代</div></div>
  </div>
  <div class="cap">然后按<strong>生命周期阶段</strong>匹配对应 skill</div>
</div>
</body>
</html>
