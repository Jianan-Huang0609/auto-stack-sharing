<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V8 Video Base · Personal AI Work System</title><style>*{box-sizing:border-box}body{margin:0;background:#111;display:grid;grid-template-columns:280px 1fr;height:100vh;font-family:-apple-system,"PingFang SC",sans-serif}.nav{background:#f7faff;border-right:1px solid #dbe7f5;padding:18px;overflow:auto}.nav h3{margin:0 0 6px}.nav p{font-size:12px;color:#64748b;line-height:1.5}.nav button{display:block;width:100%;margin:7px 0;padding:10px;border:1px solid #dbe7f5;background:white;border-radius:10px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#2563eb;color:white;border-color:#2563eb}.stage{display:flex;align-items:center;justify-content:center}.wrap{width:min(1280px,calc(100vw - 330px));aspect-ratio:16/9;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.35)}iframe{position:absolute;inset:0;width:1920px;height:1080px;transform:scale(calc(min((100vw - 330px)/1920, (100vh - 40px)/1080)));transform-origin:0 0;border:0}</style></head><body><div class="nav"><h3>V8 视频稿 HTML base</h3><p>开场前播放：纯肌肉展示 trailer。顺序：n8n → Copilot+Skill → Agent 搭建 → 反转 → 钩子。</p><div id="buttons"></div></div><div class="stage"><div class="wrap"><iframe id="f" src="scene-01-cold-open.html"></iframe></div></div><script>const scenes=['scene-01-cold-open.html','scene-02-muscle-montage.html','scene-03-n8n-loop.html','scene-04-skills.html','scene-05-agent-os.html','scene-06-three-layer.html','scene-07-minimum-playbooks.html'];buttons.innerHTML=scenes.map((s,i)=>`<button ${i?'':'class=active'} onclick="load('${s}',this)">${String(i+1).padStart(2,'0')} · ${s}</button>`).join('');function load(x,b){f.src=x;document.querySelectorAll('button').forEach(i=>i.classList.remove('active'));b.classList.add('active')}</script></body></html>
